# Reusable Claude PR review. Repos call it from a short workflow
# (templates/claude-review.yml); install.sh adds that caller.
name: Claude PR review (reusable)

on:
  workflow_call:
    inputs:
      pr_number:
        description: Number of the pull request to review
        required: true
        type: number
      hint:
        description: Optional repo-specific line added to the review prompt
        required: false
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

concurrency:
  group: claude-review-${{ github.repository }}-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      # The review runs the PR's own build and tests in a job that holds the
      # token, so it never reviews a PR whose code comes from a fork. Fork PRs
      # get no secrets on pull_request; the head check also covers a manual
      # run pointed at a fork PR.
      - name: Check for the review token and a same-repo PR
        id: token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set (or this is a fork PR); skipping the Claude review."
          elif [ "$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)" != "false" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR $PR_NUMBER comes from a fork; skipping the Claude review, which runs the PR's code."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 0
          ref: refs/pull/${{ inputs.pr_number }}/head

      # Load the reviewer from agent-factory's main, not the PR, so a PR
      # can't rewrite its own reviewer and repos without the agent file work.
      - uses: actions/checkout@v5
        if: steps.token.outputs.present == 'true'
        with:
          repository: boristopalov/agent-factory
          ref: main
          path: .agent-factory
          sparse-checkout: .claude/agents/review.md
          sparse-checkout-cone-mode: false

      - name: Install the Rust toolchain
        if: steps.token.outputs.present == 'true' && hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo builds
        if: steps.token.outputs.present == 'true' && hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@v2

      - name: Use the shared review agent
        if: steps.token.outputs.present == 'true'
        run: |
          mkdir -p .claude/agents
          cp .agent-factory/.claude/agents/review.md .claude/agents/review.md
          rm -rf .agent-factory

      - uses: anthropics/claude-code-action@v1
        id: claude
        if: steps.token.outputs.present == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ inputs.pr_number }}

            Review this pull request. ${{ inputs.hint }}
          claude_args: >-
            --agent review
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(cargo build:*),Bash(cargo check:*),Bash(cargo test:*),Bash(cargo clippy:*),Bash(cargo bench:*),Bash(git worktree add:*),Read,Grep,Glob"

      # The agent sometimes ended without running `gh pr comment`, so those reviews
      # posted nothing. Posting its final message here makes every finished review
      # leave a comment.
      - name: Post the review summary
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          # The action runs no review when the caller workflow differs from
          # the default branch's copy, as on a PR that adds it.
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "::notice::The action ran no review, so there is no summary to post."
            exit 0
          fi
          jq -rs 'flatten(1) | map(select(.type == "result")) | last | .result // empty' "$EXECUTION_FILE" > summary.md
          if [ ! -s summary.md ]; then
            echo "::error::The review finished without a summary to post."
            exit 1
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file summary.md
