name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Number of the pull request to review
        required: true
        type: number

jobs:
  review:
    uses: boristopalov/agent-factory/.github/workflows/review.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
      hint: ""
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
