# The loop between our agents.
#
# Each role is a plain prompt in agents/<name>.md plus the settings under
# `agents:` below. `targets:` maps those neutral settings to each harness;
# generate.py writes the files each harness reads (.claude/agents/ for
# Claude Code, codex/AGENTS.md for Codex). Edit agents/ and this file, never
# the generated files.
#
# Linear is the queue. Issue states:
#   Backlog      new or needs a decision; triage works these
#   Todo         ready; any agent may pick it up
#   In Progress  an agent is working on it or its PR is open
#   Done         Boris merged the PR
#
# Each stage says how it starts:
#   enforced_by: a workflow in the consuming repo runs it automatically.
#   scheduled:   the coordinator's scheduled run starts it.
# Nothing here is executed by a runtime; this file is the spec, and the
# workflows and scheduled run it names are what actually run.
version: 1

queue: { linear: { project: cmudb, team: BOR } }

# model: strong or fast. tools: all, or a list of read, shell, edit, pr_comment.
agents:
  triage:
    description: Triages the project's Linear issues so agents know what they may pick up. Use on new or Backlog issues, or on a scheduled pass.
    model: fast
    tools: all
  implement:
    description: Implements a triaged work item and opens a pull request. Use when the acceptance criteria are clear.
    model: strong
    tools: all
  review:
    description: Reviews a pull request's changes and reports real problems ranked by severity. Read-only; comments but never edits or approves.
    model: strong
    tools: [read, shell, pr_comment]
  test:
    description: Adds tests to raise coverage and catch regressions on a branch or PR. Use when coverage is below the gate or a change lacks tests.
    model: fast
    tools: all
  benchmark:
    description: Measures performance of a change against a baseline. Runs by hand, never in CI.
    model: fast
    tools: all

targets:
  claude-code:
    models: { strong: opus, fast: sonnet }
    tools:
      read: [Read, Grep, Glob]
      shell: [Bash]
      edit: [Edit, Write]
      pr_comment: [mcp__github_inline_comment__create_inline_comment]
  codex:
    # Codex uses the model in your Codex config; set one here to pin it.
    models: {}
    # Roles without edit run in Codex's read-only sandbox.

stages:
  triage:
    agent: triage
    trigger: { linear: { state: Backlog } }
    scheduled: true
    next: implement            # by moving the issue to Todo

  implement:
    agent: implement
    trigger: { linear: { state: Todo } }
    scheduled: true
    max_parallel: 2
    sets_state: In Progress
    output: pull_request
    next: [review, test]

  review:
    agent: review
    trigger: { github: { pull_request: [opened, synchronize, reopened, ready_for_review] } }
    enforced_by: .github/workflows/claude-review.yml
    next: implement            # findings go back to the PR's implementer

  test:
    agent: test
    trigger: { gate_failed: coverage }
    scheduled: true

  benchmark:
    agent: benchmark
    trigger: { on_request: true }   # by hand, never in CI

# A PR is merge-ready when every gate passes. Boris merges; agents never do.
gates:
  ci_green:        { enforced_by: .github/workflows/ci.yml }
  coverage:        { min_lines: 80, enforced_by: .github/workflows/ci.yml }
  review_findings: { rule: "no open correctness or concurrency findings" }
  merge:           { by: boris }

# When the loop pings Boris. Everything else, agents handle.
ping_boris:
  - a PR is merge-ready
  - an issue is flagged "Needs Boris:"
  - work is stuck (CI red or a review finding unresolved after two attempts)
